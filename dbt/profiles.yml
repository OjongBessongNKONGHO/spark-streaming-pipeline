weather_streaming:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'streaming_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'streaming_password') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'weather_streaming') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
      connect_timeout: 10

    prod:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'weather_streaming') }}"
      schema: marts
      threads: 8
      keepalives_idle: 0
      connect_timeout: 10