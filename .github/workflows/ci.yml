name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pydantic==2.5.3 \
            kafka-python==2.0.2 \
            requests==2.31.0 \
            python-dotenv==1.0.0 \
            pyyaml==6.0.1 \
            fastavro==1.9.4 \
            pytest==7.4.4 \
            pytest-cov==4.1.0 \
            black==24.3.0 \
            pyspark==3.5.0 \
            delta-spark==3.0.0

      - name: Check formatting
        run: python -m black --check producer/ consumer/ jobs/ tests/

      - name: Run all tests
        env:
          OPENWEATHER_API_KEY: test_key
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: weather_streaming
          POSTGRES_USER: streaming_user
          POSTGRES_PASSWORD: streaming_password
        run: |
          pytest tests/ -v --cov=producer --cov=consumer --cov-report=term-missing
